an> 与 <span class=\"katex-inline\">k<\/span>，再取指数还原 <span class=\"katex-inline\">C<\/span>。<\/p>\n<p>拟合好坏用 <span class=\"katex-inline\">R^2<\/span>：<\/p>\n<div class=\"katex-block\">R^2=1-\\frac{\\sum(y_i-\\hat y_i)^2}{\\sum(y_i-\\bar y)^2}<\/div>\n<p><span class=\"katex-inline\">R^2<\/span> 接近 1 表示拟合得好。但它只衡量&quot;点离曲线近不近&quot;，不保证模型有物理意义，也不保证外推可靠。<\/p>\n<pre class=\"lang-python\"><code>from scipy.optimize import curve_fit\npopt, pcov = curve_fit(model, t, T, p0=[20, 90, 0.05])<\/code><\/pre>\n<h2>常见误解<\/h2>\n<ul><li>\n别用 <span class=\"katex-inline\">R^2<\/span> 高就认定模型对——过拟合也能得到很高的 <span class=\"katex-inline\">R^2<\/span>。\n<\/li><li>\n别在指数模型里直接对 <span class=\"katex-inline\">y<\/span> 做线性拟合——要先取对数，否则权重不对。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>数据拟合<\/td><td>残差平方和最小<\/td><\/tr><tr><td>第 6 章<\/td><td>冷却模型<\/td><td>拟合求 k<\/td><\/tr><tr><td>第 3 章<\/td><td>最优化<\/td><td>最小二乘本身是优化问题<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：导数、极值\n<\/li><li>\n后续：回归分析、实验设计\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：极限地基：函数、极限、连续<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch01\">第 1 章：函数、极限与连续<\/a><br>检查点：能算 0/0 型极限，能判断四类间断点，自测 ≥80%<\/li><li class='path-step' id='path-02'><strong>步骤 02：导数与微分：变化率语言<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch02\">第 2 章：导数与微分<\/a><br>检查点：能用定义算导数，能套链式法则，能做线性近似<\/li><li class='path-step' id='path-03'><strong>步骤 03：中值定理与最优化<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch03\">第 3 章：微分中值定理与导数的应用<\/a><br>检查点：能证简单不等式，能求单调区间与极值，能解最省料问题<\/li><li class='path-step' id='path-04'><strong>步骤 04：不定积分：求导的逆运算<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch04\">第 4 章：不定积分<\/a><br>检查点：能默写基本积分表，能完成换元与分部积分<\/li><li class='path-step' id='path-05'><strong>步骤 05：定积分：累积量的计算<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch05\">第 5 章：定积分及其应用<\/a><br>检查点：能算定积分与反常积分，能用微元法求面积体积<\/li><li class='path-step' id='path-06'><strong>步骤 06：微分方程：从变化规律到过程曲线<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch06\">第 6 章：微分方程<\/a><br>检查点：能解可分离、一阶线性、二阶常系数方程，能建冷却模型<\/li><li class='path-step' id='path-07'><strong>步骤 07：多元微分：多参数优化<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch07\">第 7 章：多元函数微分学<\/a><br>检查点：能求偏导与全微分，能用拉格朗日乘数法解约束优化<\/li><li class='path-step' id='path-08'><strong>步骤 08：二重积分：平面上的累加<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch08\">第 8 章：二重积分<\/a><br>检查点：能定限、能换序、能用极坐标算圆域积分<\/li><li class='path-step' id='path-09'><strong>步骤 09：无穷级数：近似与判别<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch09\">第 9 章：无穷级数<\/a><br>检查点：能判断常见级数敛散，能写泰勒展开并估误差<\/li><li class='path-step' id='path-10'><strong>步骤 10：数学实验：软件与误差<\/strong><br>阅读：<a href=\"#/book/food-math/chapter/ch10\">第 10 章：数学实验与误差分析<\/a><br>检查点：能跑数值积分与拟合，能正确记录有效数字<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：函数、极限与连续<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single' data-concept='c04' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> lim(x→0) sin3x / x 等于多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 3<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 不存在<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single' iz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch10__": "<h1>测验：第 10 章：数学实验与误差分析<\/h1><div class='quiz-item' data-qid='ch10-q46' data-type='single' data-concept='c31' data-chapter='ch10'><p class='quiz-q'><b>Q1.<\/b> 中心差商近似导数的误差阶是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q46' value='0'> O(h)<\/label><label class='quiz-opt'><input type='radio' name='ch10-q46' value='1'> O(h²)<\/label><label class='quiz-opt'><input type='radio' name='ch10-q46' value='2'> O(h³)<\/label><label class='quiz-opt'><input type='radio' name='ch10-q46' value='3'> O(1)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q47' data-type='single' data-concept='c31' data-chapter='ch10'><p class='quiz-q'><b>Q2.<\/b> 0.03050 的有效数字位数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q47' value='0'> 3 位<\/label><label class='quiz-opt'><input type='radio' name='ch10-q47' value='1'> 4 位<\/label><label class='quiz-opt'><input type='radio' name='ch10-q47' value='2'> 5 位<\/label><label class='quiz-opt'><input type='radio' name='ch10-q47' value='3'> 6 位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q48' data-type='single' data-concept='c32' data-chapter='ch10'><p class='quiz-q'><b>Q3.<\/b> 拟合的 R²=0.99 说明什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q48' value='0' data-misconception=\"m10\"> 模型一定正确<\/label><label class='quiz-opt'><input type='radio' name='ch10-q48' value='1'> 拟合程度高，但不保证模型有物理意义<\/label><label class='quiz-opt'><input type='radio' name='ch10-q48' value='2'> 数据没有误差<\/label><label class='quiz-opt'><input type='radio' name='ch10-q48' value='3'> 可以随意外推<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q49' data-type='single' data-concept='c32' data-chapter='ch10'><p class='quiz-q'><b>Q4.<\/b> 对 y=Ce^(kx) 做最小二乘拟合，通常先做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q49' value='0'> 直接对 y 线性拟合<\/label><label class='quiz-opt'><input type='radio' name='ch10-q49' value='1'> 两边取对数化成线性<\/label><label class='quiz-opt'><input type='radio' name='ch10-q49' value='2'> 对 x 取平方<\/label><label class='quiz-opt'><input type='radio' name='ch10-q49' value='3'> 先求导<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch10-q50' data-type='single' data-concept='c31' data-chapter='ch10'><p class='quiz-q'><b>Q5.<\/b> 用感量 0.0001 g 的天平称得 2.0034 g，结果应记为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch10-q50' value='0'> 2.0 g<\/label><label class='quiz-opt'><input type='radio' name='ch10-q50' value='1'> 2.00 g<\/label><label class='quiz-opt'><input type='radio' name='ch10-q50' value='2'> 2.003 g<\/label><label class='quiz-opt'><input type='radio' name='ch10-q50' value='3'> 2.0034 g<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz___all__": "<h1>测验：__all<\/h1><div class='quiz-item' data-qid='q51' data-type='single' data-concept='c18' data-chapter='__all'><p class='quiz-q'><b>Q1.<\/b> 牛顿—莱布尼茨公式把定积分转化为什么运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q51' value='0'> 求极限<\/label><label class='quiz-opt'><input type='radio' name='q51' value='1'> 求原函数后代端点相减<\/label><label class='quiz-opt'><input type='radio' name='q51' value='2'> 数值求和<\/label><label class='quiz-opt'><input type='radio' name='q51' value='3'> 求导数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q52' data-type='single' data-concept='c22' data-chapter='__all'><p class='quiz-q'><b>Q2.<\/b> 一阶线性方程 y&#x27;+P(x)y=Q(x) 的关键技巧是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q52' value='0'> 分离变量<\/label><label class='quiz-opt'><input type='radio' name='q52' value='1'> 乘积分因子 e^(∫Pdx)<\/label><label class='quiz-opt'><input type='radio' name='q52' value='2'> 令 u=y/x<\/label><label class='quiz-opt'><input type='radio' name='q52' value='3'> 猜 y=e^(rx)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q53' data-type='single' data-concept='c28' data-chapter='__all'><p class='quiz-q'><b>Q3.<\/b> 圆域上的二重积分优先用哪种坐标？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q53' value='0'> 直角坐标<\/label><label class='quiz-opt'><input type='radio' name='q53' value='1'> 极坐标<\/label><label class='quiz-opt'><input type='radio' name='q53' value='2'> 球坐标<\/label><label class='quiz-opt'><input type='radio' name='q53' value='3'> 柱坐标<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q54' data-type='single' data-concept='c29' data-chapter='__all'><p class='quiz-q'><b>Q4.<\/b> 正项级数用比值判别得 L=1 时，应该？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q54' value='0'> 判定收敛<\/label><label class='quiz-opt'><input type='radio' name='q54' value='1'> 判定发散<\/label><label class='quiz-opt'><input type='radio' name='q54' value='2'> 换比较或积分判别<\/label><label class='quiz-opt'><input type='radio' name='q54' value='3'> 直接求和<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q55' data-type='single' data-concept='c09' data-chapter='__all'><p class='quiz-q'><b>Q5.<\/b> pH 读数 4.20±0.05，氢离子浓度的相对误差约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q55' value='0'> 5%<\/label><label class='quiz-opt'><input type='radio' name='q55' value='1'> 11.5%<\/label><label class='quiz-opt'><input type='radio' name='q55' value='2'> 0.05%<\/label><label class='quiz-opt'><input type='radio' name='q55' value='3'> 50%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q56' data-type='multi' data-concept='c06' data-chapter='__all'><p class='quiz-q'><b>Q6.<\/b> 下列关于可导与连续的说法，正确的有？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q56' value='0'> 可导必连续<\/label><label class='quiz-opt'><input type='checkbox' name='q56' value='1'> 连续不一定可导<\/label><label class='quiz-opt'><input type='checkbox' name='q56' value='2'> 连续必可导<\/label><label class='quiz-opt'><input type='checkbox' name='q56' value='3'> 可导不一定连续<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='函数'>函数 — 输入一个数、按规则输出唯一一个数的对应关系 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='定义域'>定义域 — 自变量允许取值的全体 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='复合函数'>复合函数 — 把一个函数的输出作为另一个函数的输入 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='数列'>数列 — 按顺序排列的一列数 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='极限'>极限 — 自变量趋近某值时函数值趋近的确定数 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='ε-n 定义'>ε-N 定义 — 用任意小正数 ε 和门槛 N 精确描述数列收敛 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='左极限'>左极限 — 自变量从小于该点的一侧趋近时的极限 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='右极限'>右极限 — 自变量从大于该点的一侧趋近时的极限 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='无穷小'>无穷小 — 极限为 0 的变量 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='无穷大'>无穷大 — 绝对值可以任意大的变量，记作 ∞ <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='等价无穷小'>等价无穷小 — 两个无穷小之比的极限为 1 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='连续'>连续 — 极限值等于函数值 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='可去间断点'>可去间断点 — 极限存在但函数值不等或没定义 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='跳跃间断点'>跳跃间断点 — 左右极限都存在但不相等 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='介值定理'>介值定理 — 闭区间连续函数能取到两端函数值之间的任何数 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='零点定理'>零点定理 — 闭区间连续且两端异号时区间内必有零点 <span class=glossary-ref>（第 1 章：函数、极限与连续）<\/span><\/li><li data-term='导数'>导数 — 平均变化率在自变量增量趋于 0 时的极限 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='可导'>可导 — 导数存在；可导必连续 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='切线'>切线 — 过曲线上一点、斜率为该点导数的直线 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='高阶导数'>高阶导数 — 导数的导数，二阶导数记 y&#x27;&#x27; <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='链式法则'>链式法则 — 复合函数求导：外层导数乘内层导数 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='隐函数'>隐函数 — 没有解出 y、藏在方程 F(x,y)=0 里的函数 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='微分'>微分 — 函数改变量的线性主部 dy=f&#x27;(x)dx <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='误差传递'>误差传递 — 测量误差通过函数关系放大或缩小的规律 <span class=glossary-ref>（第 2 章：导数与微分）<\/span><\/li><li data-term='罗尔定理'>罗尔定理 — 两端等高时区间内存在导数为 0 的点 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='拉格朗日中值定理'>拉格朗日中值定理 — 平均变化率等于区间内某点的瞬时变化率 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='柯西中值定理'>柯西中值定理 — 两个函数变化率之比等于某点导数之比 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='洛必达法则'>洛必达法则 — 0/0 或 ∞/∞ 型极限用导数之比计算 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='驻点'>驻点 — 导数为 0 的点 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='极值'>极值 — 函数在某点邻域内的最大或最小值 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='拐点'>拐点 — 凹凸性改变的点 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='渐近线'>渐近线 — 曲线无限接近的直线 <span class=glossary-ref>（第 3 章：微分中值定理与导数的应用）<\/span><\/li><li data-term='原函数'>原函数 — 导数等于给定函数的函数 <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='不定积分'>不定积分 — 全体原函数，记作 ∫f dx=F+C <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='积分常数'>积分常数 — 不定积分中的任意常数 C <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='凑微分'>凑微分 — 把被积式写成 f(φ(x))φ&#x27;(x)dx 的形式 <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='分部积分'>分部积分 — ∫u dv=uv-∫v du <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='部分分式'>部分分式 — 把有理函数拆成简单分式之和 <span class=glossary-ref>（第 4 章：不定积分）<\/span><\/li><li data-term='定积分'>定积分 — 分割、近似、求和、取极限得到的有向面积 <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='可积'>可积 — 定积分的极限存在 <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='积分上限函数'>积分上限函数 — Φ(x)=∫_a^x f(t)dt <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='牛顿—莱布尼茨公式'>牛顿—莱布尼茨公式 — ∫_a^b f dx=F(b)-F(a) <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='反常积分'>反常积分 — 无穷区间或无界函数上的积分 <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='微元法'>微元法 — 把总量切成微元再积分的方法 <span class=glossary-ref>（第 5 章：定积分及其应用）<\/span><\/li><li data-term='微分方程'>微分方程 — 含未知函数及其导数的方程 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='通解'>通解 — 含与阶数相同个数的任意常数的解 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='特解'>特解 — 用初始条件定出常数后的解 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='可分离变量'>可分离变量 — 能写成 f(x)g(y) 形式的方程 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='积分因子'>积分因子 — 使一阶线性方程左边成为乘积导数的因子 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='特征方程'>特征方程 — 二阶常系数方程对应的 r²+pr+q=0 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='逻辑斯蒂增长'>逻辑斯蒂增长 — 有承载上限的增长模型 <span class=glossary-ref>（第 6 章：微分方程）<\/span><\/li><li data-term='偏导数'>偏导数 — 固定其余变量、对一个变量求导 <span class=glossary-ref>（第 7 章：多元函数微分学）<\/span><\/li><li data-term='全微分'>全微分 — 各偏导乘以对应增量再相加 <span class=glossary-ref>（第 7 章：多元函数微分学）<\/span><\/li><li data-term='梯度'>梯度 — 偏导数组成的向量，指向增长最快方向 <span class=glossary-ref>（第 7 章：多元函数微分学）<\/span><\/li><li data-term='方向导数'>方向导数 — 沿某方向的变化率，等于梯度与该方向单位向量的点积 <span class=glossary-ref>（第 7 章：多元函数微分学）<\/span><\/li><li data-term='拉格朗日乘数法'>拉格朗日乘数法 — 带约束极值的求解方法 <span class=glossary-ref>（第 7 章：多元函数微分学）<\/span><\/li><li data-term='二重积分'>二重积分 — 平面区域上的分割求和取极限 <span class=glossary-ref>（第 8 章：二重积分）<\/span><\/li><li data-term='极坐标'>极坐标 — 用 r 与 θ 表示平面点的坐标系 <span class=glossary-ref>（第 8 章：二重积分）<\/span><\/li><li data-term='曲顶柱体'>曲顶柱体 — 以平面区域为底、曲面为顶的立体 <span class=glossary-ref>（第 8 章：二重积分）<\/span><\/li><li data-term='级数'>级数 — 无穷多个数相加 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='部分和'>部分和 — 前 n 项的和 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='收敛'>收敛 — 部分和数列有极限 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='发散'>发散 — 部分和数列没有极限 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 绝对值级数也收敛 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='条件收敛'>条件收敛 — 本身收敛但绝对值级数发散 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='幂级数'>幂级数 — 形如 Σa_n(x-x0)^n 的级数 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='收敛半径'>收敛半径 — 幂级数绝对收敛的区间半径 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='泰勒级数'>泰勒级数 — 用各阶导数系数写成的幂级数 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='余项'>余项 — 泰勒多项式与原函数的差 <span class=glossary-ref>（第 9 章：无穷级数）<\/span><\/li><li data-term='数值微分'>数值微分 — 用差商近似导数 <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><li data-term='数值积分'>数值积分 — 用求积公式近似定积分 <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><li data-term='梯形公式'>梯形公式 — 用梯形面积近似积分，误差 O(h²) <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 使残差平方和最小的拟合方法 <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><li data-term='有效数字'>有效数字 — 从第一个非零数字起算的可靠数字 <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><li data-term='修约'>修约 — 按规则舍入数值 <span class=glossary-ref>（第 10 章：数学实验与误差分析）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：极限计算的五级漏斗<\/h2>\n<p>按顺序过，前一级能出结果就停。<\/p>\n<ol><li>\n<strong>代入<\/strong>：把 <span class=\"katex-inline\">x<\/span> 的值直接代进去。不是未定式就有答案。\n<\/li><li>\n<strong>化简<\/strong>：约公因式、通分、有理化、分子分母同除最高次幂。\n<\/li><li>\n<strong>等价替换<\/strong>：只对乘除因子替换。<span class=\"katex-inline\">x\\to0<\/span> 时 <span class=\"katex-inline\">\\sin x\\sim x<\/span>、<span class=\"katex-inline\">1-\\cos x\\sim x^2/2<\/span>、<span class=\"katex-inline\">\\ln(1+x)\\sim x<\/span>。\n<\/li><li>\n<strong>两个重要极限或洛必达<\/strong>：结构像 <span class=\"katex-inline\">\\frac{\\sin\\Box}{\\Box}<\/span> 用第一个；像 <span class=\"katex-inline\">(1+\\Box)^{1/\\Box}<\/span> 用第二个；<span class=\"katex-inline\">\\frac{0}{0}<\/span> 或 <span class=\"katex-inline\">\\frac{\\infty}{\\infty}<\/span> 用洛必达。\n<\/li><li>\n<strong>泰勒展开<\/strong>：前四级都卡住，或需要保留高阶项时，展开到同阶。\n<\/ol>\n<h2>框架：积分的三层策略<\/h2>\n<ol><li>\n<strong>查表<\/strong>：能直接对上基本积分表就写答案，别忘了 <span class=\"katex-inline\">+C<\/span>。\n<\/li><li>\n<strong>换元<\/strong>：\n<ul>\n<li>\n看见&quot;函数 + 它的导数&quot;配对，用第一类（凑微分）。\n<\/li><li>\n看见根式 <span class=\"katex-inline\">\\sqrt{ax+b}<\/span> 或 <span class=\"katex-inline\">\\sqrt{a^2-x^2}<\/span>，用第二类。\n<\/li><li>\n<strong>分部<\/strong>：两类不同函数相乘，按 LIATE 选 <span class=\"katex-inline\">u<\/span>。多项式配指数/三角，多项式当 <span class=\"katex-inline\">u<\/span>；多项式配对数/反三角，对数/反三角当 <span class=\"katex-inline\">u<\/span>。\n<\/li><li>\n<strong>兜底变形<\/strong>：拆项、配方、分子分母同除、倒代换。\n<\/ul>\n<\/ol>\n<h2>框架：微分方程识别树<\/h2>\n<ul><li>\n一阶：\n<ul>\n<li>\n能写成 <span class=\"katex-inline\">f(x)g(y)<\/span> → 可分离变量。\n<\/li><li>\n能写成 <span class=\"katex-inline\">\\varphi(y/x)<\/span> → 令 <span class=\"katex-inline\">u=y/x<\/span>。\n<\/li><li>\n形如 <span class=\"katex-inline\">y&#x27;+P(x)y=Q(x)<\/span> → 积分因子。\n<\/li><li>\n二阶：\n<\/li><li>\n缺 <span class=\"katex-inline\">y<\/span> 或缺 <span class=\"katex-inline\">x<\/span> → 降阶（令 <span class=\"katex-inline\">p=y&#x27;<\/span>）。\n<\/li><li>\n常系数齐次 → 特征方程。\n<\/li><li>\n常系数非齐次 → 齐次通解 + 待定特解。\n<\/li><li>\n应用题：先写&quot;变化率 = 什么&quot;，再判断方程类型。\n<\/ul>\n<\/ul>\n<h2>框架：最优化四步<\/h2>\n<ol><li>\n设变量，写目标函数。\n<\/li><li>\n用约束消元，化成一元（或多元）。\n<\/li><li>\n求导找驻点，或用拉格朗日乘数法。\n<\/li><li>\n判断最大/最小：二阶导、实际意义、端点比较。\n<\/ol>\n<h2>框架：二重积分定限<\/h2>\n<ol><li>\n画区域。\n<\/li><li>\n判断 X 型还是 Y 型，或圆域转极坐标。\n<\/li><li>\n写内层上下限（可含外层变量），再写外层常数限。\n<\/li><li>\n内层积不出来，换序。\n<\/ol>\n<h2>框架：级数判别<\/h2>\n<ol><li>\n通项不趋于 0 → 发散，结束。\n<\/li><li>\n正项 → 比值或根值；<span class=\"katex-inline\">L=1<\/span> 时换比较或积分。\n<\/li><li>\n交错 → 莱布尼茨；再看绝对值级数判断绝对/条件收敛。\n<\/li><li>\n幂级数 → 先求 <span class=\"katex-inline\">R<\/span>，再单独查端点。\n<\/ol>\n<h2>决策规则<\/h2>\n<ul><li>\n看到 <span class=\"katex-inline\">\\frac{0}{0}<\/span>：先因式分解，再等价替换，最后洛必达。\n<\/li><li>\n看到根号差：先有理化。\n<\/li><li>\n看到 <span class=\"katex-inline\">x^x<\/span> 或幂指函数：先取对数。\n<\/li><li>\n看到&quot;总量&quot;&quot;累积&quot;&quot;平均&quot;：想积分。\n<\/li><li>\n看到&quot;变化率与当前量成正比&quot;：想指数解 <span class=\"katex-inline\">y=Ce^{kt}<\/span>。\n<\/li><li>\n看到&quot;有上限的增长&quot;：想逻辑斯蒂。\n<\/li><li>\n看到&quot;固定周长/面积/体积，求最大/最小&quot;：想拉格朗日或边界最优。\n<\/li><li>\n看到 <span class=\"katex-inline\">R^2<\/span> 很高：先问模型假设是否成立，再看残差图。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>硬用洛必达<\/strong>：不是未定式也求导，答案必错。替代：先代值判断类型。\n<\/li><li>\n<strong>加减法里替换等价无穷小<\/strong>：会丢高阶项。替代：通分后用泰勒展开到同阶。\n<\/li><li>\n<strong>积完忘 <span class=\"katex-inline\">+C<\/span><\/strong>：不定积分是一族函数。替代：每写完立即检查常数。\n<\/li><li>\n<strong>换元不换上下限<\/strong>：定积分换元后仍用原限，结果必错。替代：换元的同时改写限。\n<\/li><li>\n<strong>极坐标漏 <span class=\"katex-inline\">r<\/span><\/strong>：面积元是 <span class=\"katex-inline\">r\\,dr\\,d\\theta<\/span>。替代：写完面积元先检查量纲（长度²）。\n<\/li><li>\n<strong>把极值当最值<\/strong>：极值只在邻域内比较。替代：闭区间题必须比端点。\n<\/li><li>\n<strong>把 <span class=\"katex-inline\">R^2<\/span> 当模型正确性<\/strong>：过拟合也能高。替代：看残差、看外推验证。\n<\/li><li>\n<strong>步长无限缩小<\/strong>：浮点误差反噬。替代：中心差商取 <span class=\"katex-inline\">h\\approx10^{-5}<\/span>，或直接换自适应算法。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>基本导数<\/h2>\n<table><thead><tr><th>函数<\/th><th>导数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">C<\/span><\/td><td>0<\/td><\/tr><tr><td><span class=\"katex-inline\">x^n<\/span><\/td><td><span class=\"katex-inline\">nx^{n-1}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\sin x<\/span><\/td><td><span class=\"katex-inline\">\\cos x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\cos x<\/span><\/td><td><span class=\"katex-inline\">-\\sin x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^x<\/span><\/td><td><span class=\"katex-inline\">e^x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">a^x<\/span><\/td><td><span class=\"katex-inline\">a^x\\ln a<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\ln x<\/span><\/td><td><span class=\"katex-inline\">1/x<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\arctan x<\/span><\/td><td><span class=\"katex-inline\">1/(1+x^2)<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\arcsin x<\/span><\/td><td><span class=\"katex-inline\">1/\\sqrt{1-x^2}<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>求导法则<\/h2>\n<table><thead><tr><th>法则<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>和差<\/td><td><span class=\"katex-inline\">(u\\pm v)&#x27;=u&#x27;\\pm v&#x27;<\/span><\/td><\/tr><tr><td>乘积<\/td><td><span class=\"katex-inline\">(uv)&#x27;=u&#x27;v+uv&#x27;<\/span><\/td><\/tr><tr><td>商<\/td><td><span class=\"katex-inline\">(u/v)&#x27;=(u&#x27;v-uv&#x27;)/v^2<\/span><\/td><\/tr><tr><td>链式<\/td><td><span class=\"katex-inline\">(f(g(x)))&#x27;=f&#x27;(g(x))g&#x27;(x)<\/span><\/td><\/tr><tr><td>参数方程<\/td><td><span class=\"katex-inline\">dy/dx=(dy/dt)/(dx/dt)<\/span><\/td><\/tr><tr><td>隐函数<\/td><td>两边求导，解出 <span class=\"katex-inline\">y&#x27;<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>基本积分<\/h2>\n<table><thead><tr><th>被积函数<\/th><th>原函数<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">x^n\\ (n\\ne-1)<\/span><\/td><td><span class=\"katex-inline\">x^{n+1}/(n+1)+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1/x<\/span><\/td><td><span class=\"katex-inline\">\\ln\\lvert x\\rvert+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">e^x<\/span><\/td><td><span class=\"katex-inline\">e^x+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\sin x<\/span><\/td><td><span class=\"katex-inline\">-\\cos x+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\cos x<\/span><\/td><td><span class=\"katex-inline\">\\sin x+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\sec^2x<\/span><\/td><td><span class=\"katex-inline\">\\tan x+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1/(1+x^2)<\/span><\/td><td><span class=\"katex-inline\">\\arctan x+C<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1/\\sqrt{1-x^2}<\/span><\/td><td><span class=\"katex-inline\">\\arcsin x+C<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>泰勒展开（<span class=\"katex-inline\">x_0=0<\/span>）<\/h2>\n<table><thead><tr><th>函数<\/th><th>展开<\/th><th>收敛范围<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">e^x<\/span><\/td><td><span class=\"katex-inline\">1+x+x^2/2!+x^3/3!+\\cdots<\/span><\/td><td>全体实数<\/td><\/tr><tr><td><span class=\"katex-inline\">\\sin x<\/span><\/td><td><span class=\"katex-inline\">x-x^3/3!+x^5/5!-\\cdots<\/span><\/td><td>全体实数<\/td><\/tr><tr><td><span class=\"katex-inline\">\\cos x<\/span><\/td><td><span class=\"katex-inline\">1-x^2/2!+x^4/4!-\\cdots<\/span><\/td><td>全体实数<\/td><\/tr><tr><td><span class=\"katex-inline\">\\ln(1+x)<\/span><\/td><td><span class=\"katex-inline\">x-x^2/2+x^3/3-\\cdots<\/span><\/td><td><span class=\"katex-inline\">-1&lt;x\\le1<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">1/(1-x)<\/span><\/td><td><span class=\"katex-inline\">1+x+x^2+\\cdots<\/span><\/td><td><span class=\"katex-inline\">\\lvert x\\rvert&lt;1<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>定积分与反常积分<\/h2>\n<table><thead><tr><th>场景<\/th><th>结论<\/th><\/tr><\/thead><tbody><tr><td>牛顿—莱布尼茨<\/td><td><span class=\"katex-inline\">\\int_a^bf=F(b)-F(a)<\/span><\/td><\/tr><tr><td>换元<\/td><td><span class=\"katex-inline\">x=\\varphi(t)<\/span> 时上下限同步换成 <span class=\"katex-inline\">\\alpha,\\beta<\/span><\/td><\/tr><tr><td>分部<\/td><td><span class=\"katex-inline\">\\int_a^bu\\,dv=[uv]_a^b-\\int_a^bv\\,du<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_1^\\infty x^{-p}<\/span><\/td><td><span class=\"katex-inline\">p&gt;1<\/span> 收敛，<span class=\"katex-inline\">p\\le1<\/span> 发散<\/td><\/tr><tr><td><span class=\"katex-inline\">\\int_0^1 x^{-p}<\/span><\/td><td><span class=\"katex-inline\">p&lt;1<\/span> 收敛，<span class=\"katex-inline\">p\\ge1<\/span> 发散<\/td><\/tr><tr><td>旋转体体积<\/td><td><span class=\"katex-inline\">V=\\pi\\int_a^bf^2dx<\/span><\/td><\/tr><tr><td>平均值<\/td><td><span class=\"katex-inline\">\\bar f=\\frac{1}{b-a}\\int_a^bfdx<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>微分方程<\/h2>\n<table><thead><tr><th>类型<\/th><th>解法<\/th><\/tr><\/thead><tbody><tr><td>可分离 <span class=\"katex-inline\">y&#x27;=f(x)g(y)<\/span><\/td><td>分离后两边积分<\/td><\/tr><tr><td>齐次 <span class=\"katex-inline\">y&#x27;=\\varphi(y/x)<\/span><\/td><td>令 <span class=\"katex-inline\">u=y/x<\/span><\/td><\/tr><tr><td>一阶线性 <span class=\"katex-inline\">y&#x27;+Py=Q<\/span><\/td><td>积分因子 <span class=\"katex-inline\">e^{\\int Pdx}<\/span><\/td><\/tr><tr><td>二阶齐次<\/td><td>特征方程三种情形<\/td><\/tr><tr><td>二阶非齐次<\/td><td>齐次通解 + 待定特解<\/td><\/tr><\/tbody><\/table>\n<h2>二阶特征方程<\/h2>\n<table><thead><tr><th>判别式<\/th><th>通解<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">p^2-4q&gt;0<\/span><\/td><td><span class=\"katex-inline\">C_1e^{r_1x}+C_2e^{r_2x}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">p^2-4q=0<\/span><\/td><td><span class=\"katex-inline\">(C_1+C_2x)e^{rx}<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">p^2-4q&lt;0<\/span><\/td><td><span class=\"katex-inline\">e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>二重积分<\/h2>\n<table><thead><tr><th>区域<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>X 型<\/td><td><span class=\"katex-inline\">\\int_a^bdx\\int_{y_1(x)}^{y_2(x)}f\\,dy<\/span><\/td><\/tr><tr><td>Y 型<\/td><td><span class=\"katex-inline\">\\int_c^ddy\\int_{x_1(y)}^{x_2(y)}f\\,dx<\/span><\/td><\/tr><tr><td>极坐标<\/td><td><span class=\"katex-inline\">\\int_{\\theta_1}^{\\theta_2}d\\theta\\int_{r_1}^{r_2}f\\,r\\,dr<\/span><\/td><\/tr><tr><td>质量<\/td><td><span class=\"katex-inline\">m=\\iint\\rho\\,d\\sigma<\/span><\/td><\/tr><tr><td>平均值<\/td><td><span class=\"katex-inline\">\\bar f=\\frac{1}{A}\\iint f\\,d\\sigma<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>级数判别<\/h2>\n<table><thead><tr><th>判别法<\/th><th>判据<\/th><\/tr><\/thead><tbody><tr><td>必要条件<\/td><td><span class=\"katex-inline\">u_n\\to0<\/span>；不满足则发散<\/td><\/tr><tr><td>几何级数<\/td><td><span class=\"katex-inline\">\\sum aq^{n-1}=a/(1-q)<\/span>，<span class=\"katex-inline\">\\lvert q\\rvert&lt;1<\/span><\/td><\/tr><tr><td>p 级数<\/td><td><span class=\"katex-inline\">p&gt;1<\/span> 收敛<\/td><\/tr><tr><td>比值<\/td><td><span class=\"katex-inline\">L&lt;1<\/span> 收敛，<span class=\"katex-inline\">L&gt;1<\/span> 发散，<span class=\"katex-inline\">L=1<\/span> 失效<\/td><\/tr><tr><td>根值<\/td><td>同上<\/td><\/tr><tr><td>莱布尼茨<\/td><td><span class=\"katex-inline\">u_n<\/span> 递减趋于 0<\/td><\/tr><tr><td>幂级数半径<\/td><td><span class=\"katex-inline\">R=\\lim\\lvert a_n/a_{n+1}\\rvert<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>食品常用模型<\/h2>\n<table><thead><tr><th>过程<\/th><th>模型<\/th><th>解<\/th><\/tr><\/thead><tbody><tr><td>一级反应/降解<\/td><td><span class=\"katex-inline\">C&#x27;=-kC<\/span><\/td><td><span class=\"katex-inline\">C=C_0e^{-kt}<\/span><\/td><\/tr><tr><td>细菌指数增长<\/td><td><span class=\"katex-inline\">N&#x27;=rN<\/span><\/td><td><span class=\"katex-inline\">N=N_0e^{rt}<\/span><\/td><\/tr><tr><td>有上限增长<\/td><td><span class=\"katex-inline\">N&#x27;=rN(1-N/K)<\/span><\/td><td><span class=\"katex-inline\">N=K/[1+(K/N_0-1)e^{-rt}]<\/span><\/td><\/tr><tr><td>牛顿冷却<\/td><td><span class=\"katex-inline\">T&#x27;=-k(T-T_m)<\/span><\/td><td><span class=\"katex-inline\">T=T_m+(T_0-T_m)e^{-kt}<\/span><\/td><\/tr><tr><td>半衰期<\/td><td><span class=\"katex-inline\">C=C_0/2<\/span><\/td><td><span class=\"katex-inline\">t=\\ln2/k<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>误差<\/h2>\n<table><thead><tr><th>量<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>绝对误差<\/td><td><span class=\"katex-inline\">\\Delta y\\approx\\lvert f&#x27;(x)\\rvert\\Delta x<\/span><\/td><\/tr><tr><td>相对误差<\/td><td><span class=\"katex-inline\">\\Delta y/y\\a const CROSS = {"doc1": "<h1>高等数学 · 食品专业贯通学习总览<\/h1>\n<h2>这套课在专业里的位置<\/h2>\n<p>食品类专业的数学课不是通识摆设，它直接给四门后续课提供工具。下表按&quot;后续课程需要什么&quot;倒推本课该重点练什么。<\/p>\n<table><thead><tr><th>后续课程<\/th><th>用到的数学工具<\/th><th>对应章节<\/th><th>要练到什么程度<\/th><\/tr><\/thead><tbody><tr><td>食品化学<\/td><td>一级反应、降解速率、半衰期<\/td><td>第 2、5、6 章<\/td><td>看到&quot;速率与浓度成正比&quot;能立刻写出指数解<\/td><\/tr><tr><td>食品工程原理<\/td><td>传热温差、累积量、流体与传递<\/td><td>第 2、5、6、7 章<\/td><td>能建牛顿冷却模型，能算平均温度与总传热量<\/td><\/tr><tr><td>食品微生物<\/td><td>生长曲线、代时、对数期与稳定期<\/td><td>第 1、6 章<\/td><td>能区分指数增长与逻辑斯蒂增长，能算代时<\/td><\/tr><tr><td>分析检测<\/td><td>误差传递、标准曲线、最小二乘<\/td><td>第 2、10 章<\/td><td>能算相对误差，能用软件拟合标准曲线并报有效数字<\/td><\/tr><tr><td>食品营养与配方<\/td><td>含量计算、约束优化、成本<\/td><td>第 3、7 章<\/td><td>能把&quot;蛋白不低于 X、成本最低&quot;写成约束优化<\/td><\/tr><tr><td>质量管理<\/td><td>抽样、均值、波动<\/td><td>后续统计课<\/td><td>本课只打极限与积分的地基<\/td><\/tr><\/tbody><\/table>\n<h2>两条读法<\/h2>\n<p><strong>打基础（第 1–6 章）<\/strong>：这是专科阶段的主线，也是后续所有课的公共底座。极限、导数、积分、微分方程四块必须练到&quot;看到结构就知道用什么方法&quot;，不能停在看懂例题。<\/p>\n<p><strong>进阶（第 7–10 章）<\/strong>：多元微分、二重积分、级数、数学实验。是否全学，取决于你的后续方向。做检测与品控，重点在第 7 章的约束优化和第 10 章的误差与拟合；打算专升本或考研，第 8、9 章必须补齐。<\/p>\n<h2>学习节奏建议<\/h2>\n<ul><li>\n每周 6–8 小时，10–12 周走完。第 1、4、6 章各留两周，其余各一周。\n<\/li><li>\n每章先读&quot;一句话核心&quot;和&quot;零基础讲解&quot;，再做章末自测；自测低于 80% 不进下一章。\n<\/li><li>\n第 2、4、5 章的计算量最大，每天保持 5–10 道手算题，不要只用眼睛看。\n<\/li><li>\n每学完三章，回到诊断页抽 5 题，答错的题会沿依赖链指出根因，按提示回去补。\n<\/li><li>\n第 10 章不要留到最后才碰：学完第 5、6 章就可以开始用软件复算，手算与机算对照，误差概念才立得住。\n<\/ul>\n<h2>食品场景地图<\/h2>\n<table><thead><tr><th>场景<\/th><th>模型<\/th><th>用到的章节<\/th><\/tr><\/thead><tbody><tr><td>牛奶冷却<\/td><td>牛顿冷却 $T=T_m+(T_0-T_m)e^{-kt}$<\/td><td>第 2、5、6 章<\/td><\/tr><tr><td>维生素 C 降解<\/td><td>一级反应 $C=C_0e^{-kt}$<\/td><td>第 2、5、6 章<\/td><\/tr><tr><td>细菌繁殖<\/td><td>$N=N_0e^{rt}$ 或逻辑斯蒂<\/td><td>第 1、6 章<\/td><\/tr><tr><td>发酵罐生长<\/td><td>$N=K/[1+(K/N_0-1)e^{-rt}]$<\/td><td>第 6、10 章<\/td><\/tr><tr><td>圆形烤盘总质量<\/td><td>二重积分 $\\iint\\rho\\,d\\sigma$<\/td><td>第 8 章<\/td><\/tr><tr><td>配方成本优化<\/td><td>拉格朗日乘数法<\/td><td>第 3、7 章<\/td><\/tr><tr><td>营养标签误差<\/td><td>微分与误差传递<\/td><td>第 2、10 章<\/td><\/tr><tr><td>标准曲线拟合<\/td><td>最小二乘<\/td><td>第 10 章<\/td><\/tr><\/tbody><\/table>\n<h2>总入口<\/h2>\n<p>打开 <code>index.html<\/code>，按学习路径推进。每本书的进度独立保存在浏览器本地；手机与电脑各存一份，不互通。<\/p>", "doc2": "<h1>综合检验建议<\/h1>\n<h2>跨章整合任务<\/h2>\n<h3>任务 1：冷却曲线与平均温度<\/h3>\n<ul><li>\n涉及：第 2 章（导数）、第 5 章（积分与平均值）、第 6 章（微分方程）、第 10 章（拟合）\n<\/li><li>\n数据：一杯 90 ℃ 牛奶在 20 ℃ 房间中，测得 0、5、10、15、20、30 min 的温度为 90、74、60、49、40、33 ℃。\n<\/li><li>\n要求：\n<ol>\n<li>\n用牛顿冷却模型拟合，求出 $k$；\n<\/li><li>\n用积分算前 30 min 的平均温度；\n<\/li><li>\n用微分算 $t=10$ min 时的瞬时降温速率；\n<\/li><li>\n说明结果保留几位有效数字，依据是什么。\n<\/li><li>\n评分要点：模型形式正确（25%）、$k$ 与平均温度计算正确（40%）、导数值与单位正确（20%）、有效数字说明合理（15%）。\n<\/ol>\n<\/ul>\n<h3>任务 2：发酵动力学与预测<\/h3>\n<ul><li>\n涉及：第 6 章（逻辑斯蒂方程）、第 10 章（数值解与拟合）\n<\/li><li>\n数据：发酵罐承载上限 $K=1000$（以浊度计），初始 50，$r=0.4$/h。\n<\/li><li>\n要求：\n<ol>\n<li>\n写出解析解并算 $t=10$ h 的预测值；\n<\/li><li>\n用 <code>solve_ivp<\/code> 或 <code>ode45<\/code> 数值求解，与解析解对比；\n<\/li><li>\n找出增长最快的时刻（拐点）；\n<\/li><li>\n若实际测得 $t=10$ h 为 700 而不是 742，分析可能原因。\n<\/li><li>\n评分要点：解析解正确（30%）、数值解与解析解对照（25%）、拐点定位（20%）、偏差分析有条理（25%）。\n<\/ol>\n<\/ul>\n<h3>任务 3：配方成本优化<\/h3>\n<ul><li>\n涉及：第 3 章（最优化）、第 7 章（条件极值）\n<\/li><li>\n条件：原料 A 蛋白 20%、成本 8 元/kg；原料 B 蛋白 40%、成本 15 元/kg；配 100 kg，蛋白不低于 32%。\n<\/li><li>\n要求：\n<ol>\n<li>\n写出目标函数与约束；\n<\/li><li>\n用拉格朗日乘数法求候选点；\n<\/li><li>\n判断最优解在内部还是边界，说明理由；\n<\/li><li>\n若蛋白下限提高到 35%，最优解怎么变。\n<\/li><li>\n评分要点：建模正确（30%）、求解过程完整（40%）、边界判断有依据（20%）、灵敏度分析（10%）。\n<\/ol>\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：数学分析（极限的严格理论、一致连续、多变量微分的严格定义）→ 实变函数。适合专升本后继续读数学类课程。\n<\/li><li>\n<strong>偏工程<\/strong>：食品工程原理 → 传递现象。把本课的微分方程用到传热、传质、流体，重点补第 6、7 章。\n<\/li><li>\n<strong>偏数据<\/strong>：概率统计 → 回归分析 → 机器学习。本课第 10 章的最小二乘与误差分析是入口，下一步补假设检验与多元回归。\n<\/li><li>\n<strong>偏检测<\/strong>：分析化学 → 仪器分析 → 实验室质量管理。重点补第 2 章误差传递、第 10 章有效数字与拟合。\n<\/ol>\n<h2>自评标尺<\/h2>\n<ul><li>\n能独立完成三个任务中的两个，且计算过程无跳步：达到&quot;能应用&quot;。\n<\/li><li>\n能完成三个任务，并能指出模型失效的条件：达到&quot;能迁移&quot;。\n<\/li><li>\n只能完成套公式部分，建模与误差说明卡住：回到第 6 章和第 10 章重练。\n<\/ul>"};

function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page==='diagnosis') return '__diagnosis__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;

/* ---------- 诊断测试（总入口版） ---------- */
let diagQueue=[], diagIdx=0, diagWrong=[];
function dq(id){ return (BOOKS[cur.book].manifest.concepts||[]).find(c=>c.id===id); }
function dch(id){ return (BOOKS[cur.book].manifest.chapters||[]).find(c=>c.id===id); }
function dprereqs(node){ return (node&&(node.prerequisites||node.prereqs))||[]; }
function dlink(kind,id){ return '#/book/'+cur.book+'/'+(kind==='concept'?'concept/':'chapter/')+id; }
function traceBack(startConceptId,startChapterId){
  const seen=new Set(), chain=[], q=[];
  if(startConceptId){ const c=dq(startConceptId); if(c) q.push({node:c,kind:'concept'}); }
  if(startChapterId){ const c=dch(startChapterId); if(c) q.push({node:c,kind:'chapter'}); }
  while(q.length && chain.length<6){
    const it=q.shift(); if(seen.has(it.node.id)) continue;
    seen.add(it.node.id); chain.push(it);
    dprereqs(it.node).forEach(pid=>{
      const c=dq(pid); if(c){ q.push({node:c,kind:'concept'}); return; }
      const h=dch(pid); if(h) q.push({node:h,kind:'chapter'});
    });
  }
  return chain;
}
function initDiagnosis(){
  const btn=$('#diag-start'); if(!btn||btn.dataset.inited) return;
  btn.dataset.inited='1';
  btn.addEventListener('click',()=>{
    const all=(BOOKS[cur.book].manifest.quizzes||[]).slice();
    for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
    diagQueue=all.slice(0,Math.min(5,all.length)); diagIdx=0; diagWrong=[];
    showDiagQuestion();
  });
}
function _diagQuizHTML(q,idx){
  const t=q.type||'single', qid=q.id||('diag'+idx);
  let h=`<div class='quiz-item' data-qid='${qid}' data-type='${t}'>`;
  h+=`<p class='quiz-q'><b>Q${idx}.</b> ${esc(q.question||'')}</p>`;
  if(t==='single'||t==='multi'){
    const it=t==='single'?'radio':'checkbox'; h+="<div class='quiz-opts'>";
    (q.options||[]).forEach((o,i)=>{ h+=`<label class='quiz-opt'><input type='${it}' name='${qid}' value='${i}'> ${esc(String(o))}</label>`; });
    h+='</div>';
  } else h+=`<input class='quiz-blank' type='text' placeholder='填写答案'>`;
  h+=`<div class='quiz-actions'><button class='quiz-check'>检查答案</button><span class='quiz-feedback'></span></div></div>`;
  return h;
}
function showDiagQuestion(){
  const stage=$('#diag-stage'), result=$('#diag-result');
  if(!stage||!result) return;
  result.innerHTML='';
  if(diagIdx>=diagQueue.length){ finishDiagnosis(); return; }
  const q=diagQueue[diagIdx];
  $('#diag-progress').textContent=`第 ${diagIdx+1} / ${diagQueue.length} 题`;
  stage.innerHTML=_diagQuizHTML(q,diagIdx+1);
  const item=stage.querySelector('.quiz-item'), btn=item.querySelector('.quiz-check');
  btn.addEventListener('click',()=>{
    let correct=false;
    if(q.type==='single'){ const s=item.querySelector('input:checked'); correct=!!s&&parseInt(s.value)===q.answer; }
    else if(q.type==='multi'){
      const u=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
      const a=(Array.isArray(q.answer)?q.answer.slice():[q.answer]).sort();
      correct=u.length>0&&JSON.stringify(u)===JSON.stringify(a);
    } else { const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase(); correct=v===String(q.answer).trim().toLowerCase(); }
    if(!correct){
      diagWrong.push(q); const chain=traceBack(q.relatedConceptId,q.chapterId);
      if(chain.length>1){
        const links=chain.slice(1).map(({node,kind})=>`<div class="diag-remedy-item">建议先学：<a href="${dlink(kind,node.id)}">${esc(node.title||node.id)}</a></div>`).join('');
        result.innerHTML='<h3>这道题答错了，可能的根因：</h3>'+links+'<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
      } else result.innerHTML='<p><button id="diag-next" class="quiz-check">下一题 →</button></p>';
    } else result.innerHTML='<p>✓ 正确。<button id="diag-next" class="quiz-check">下一题 →</button></p>';
    $('#diag-next').addEventListener('click',()=>{ diagIdx++; showDiagQuestion(); });
  });
}
function finishDiagnosis(){
  const total=diagQueue.length, wrong=diagWrong.length, right=total-wrong;
  let h=`<h2>诊断完成：${right}/${total} 正确</h2>`;
  if(wrong===0) h+='<p>这组题全对，可以继续往下学。</p>';
  else{
    h+=`<p>有 ${wrong} 道题答错。下面是按依赖链回溯的补强建议：</p>`;
    const seen=new Set();
    diagWrong.forEach(q=>{ traceBack(q.relatedConceptId,q.chapterId).slice(1).forEach(({node,kind})=>{
      if(seen.has(node.id)) return; seen.add(node.id);
      h+=`<div class="diag-remedy-item">📚 <a href="${dlink(kind,node.id)}">${esc(node.title||node.id)}</a></div>`;
    }); });
  }
  h+='<p><button id="diag-restart" class="quiz-check">重新诊断</button></p>';
  $('#diag-stage').innerHTML=''; $('#diag-progress').textContent=''; $('#diag-result').innerHTML=h;
  $('#diag-restart').addEventListener('click',()=>$('#diag-start').click());
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });

}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const urls=['https://registry.npmmirror.com/mermaid/10/files/dist/mermaid.min.js',
              'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
              'https://unpkg.com/mermaid@10/dist/mermaid.min.js'];
  let ui=0;
  const tryNext=()=>{
    if(ui>=urls.length){ mermaidState='failed'; return; }
    const s=document.createElement('script');
    s.src=urls[ui++];
    let done=false;
    const next=()=>{ if(done) return; done=true; s.remove(); tryNext(); };
    const timer=setTimeout(()=>{ if(!window.mermaid) next(); },6000);
    s.onload=()=>{ done=true; clearTimeout(timer); mermaidState='loaded'; run(); };
    s.onerror=()=>{ clearTimeout(timer); next(); };
    document.head.appendChild(s);
  };
  tryNext();
}

/* ---------- KaTeX 公式渲染（多源回退） ---------- */
let katexLoading=false, katexReady=false;
function renderMath(){
  if(!document.querySelector('.katex-inline, .katex-block')) return;
  if(katexReady){ doRenderMath(); return; }
  if(katexLoading) return;
  katexLoading=true;
  const cssUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.css',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.css'
  ];
  const jsUrls=[
    'https://registry.npmmirror.com/katex/0.16.9/files/dist/katex.min.js',
    'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
    'https://unpkg.com/katex@0.16.9/dist/katex.min.js'
  ];
  let ci=0, ji=0;
  const tryCss=()=>{
    if(ci>=cssUrls.length) return;
    const link=document.createElement('link');
    link.rel='stylesheet'; link.href=cssUrls[ci++];
    link.onload=tryJs; link.onerror=()=>{link.remove(); tryCss();};
    document.head.appendChild(link);
  };
  const tryJs=()=>{
    if(ji>=jsUrls.length){ katexLoading=false; return; }
    const s=document.createElement('script');
    s.src=jsUrls[ji++];
    s.onload=()=>{ katexReady=true; katexLoading=false; doRenderMath(); };
    s.onerror=()=>{ s.remove(); tryJs(); };
    document.head.appendChild(s);
  };
  tryCss();
}
function doRenderMath(){
  if(typeof katex==='undefined') return;
  document.querySelectorAll('.katex-inline').forEach(el=>{
    try{ katex.render(el.textContent, el, {throwOnError:false}); }catch(e){}
  });
  document.querySelectorAll('.katex-block').forEach(el=>{
    try{ katex.render(el.textContent, el, {displayMode:true, throwOnError:false}); }catch(e){}
  });
}
route();
